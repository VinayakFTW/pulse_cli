[project]
name = "fusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "langchain-core>=1.6.12",
    "langgraph>=1.2.16",
    "mss>=10.2.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
    "openai>=3.13.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "soprano-tts>=0.2.0",
    "sounddevice>=0.5.6",
    "speechrecognition>=3.17.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130"},
]
torchvision = [
    { index = "pytorch-cu130"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pefile>=2024.8.26",
]
