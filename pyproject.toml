[project]
name = "fusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "faster-whisper>=1.2.1",
    "openai>=3.13.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "soprano-tts>=0.2.0",
    "sounddevice>=0.5.6",
    "speechrecognition>=3.17.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130"},
]
torchvision = [
    { index = "pytorch-cu130"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
